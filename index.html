<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="This Fully-Functional Calculator is the First-one to be developed by me" />
  <meta property="og:title" content="A Functional Calculator by rehmanali-aidev" />
  <meta property="og:description" content="Simple and styled Calculator Enjoy" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="./css/style.css" />
  <script src="./js/logic.js" defer></script>
  <title>Calculator</title>
</head>

<body>
  <h1 class="text-center">Calculator</h1>
  <div class="calculator">
    <div class="shell ">
      <input type="text" id="main-display" class="text-end form-control form-control-lg" placeholder="0" readonly />
    </div>
    <div class="button-container">
      <button value="MC">MC</button>
      <button value="MR">MR</button>
      <button value="M+">M+</button>
      <button value="M-">M-</button>
      <button value="CE" class="cleaner">CE</button>
      <button value="7" class="digit-btn">7</button>
      <button value="8" class="digit-btn">8</button>
      <button value="9" class="digit-btn">9</button>
      <button value="÷" class="operator-btn">&divide;</button>
      <button value="√" class="soperator-btn">&radic;</button>
      <button value="4" class="digit-btn">4</button>
      <button value="5" class="digit-btn">5</button>
      <button value="6" class="digit-btn">6</button>
      <button value="*" class="operator-btn">&times;</button>
      <button value="%" class="operator-btn">&percnt;</button>
      <button value="1" class="digit-btn">1</button>
      <button value="2" class="digit-btn">2</button>
      <button value="3" class="digit-btn">3</button>
      <button value="-" class="operator-btn">-</button>
      <button value="1/x" class="soperator-btn"><sup>1</sup>&frasl;<sub>x</sub></button>
      <button value="0" class="digit-btn">0</button>
      <button value="." class="digit-btn">.</button>
      <button value="+/-" class="soperator-btn"><sup>+</sup>&frasl;<sub>-</sub></button>
      <button value="+" class="operator-btn">+</button>
      <button value="=" class="equal">=</button>
    </div>
  </div>
</body>

</html>
